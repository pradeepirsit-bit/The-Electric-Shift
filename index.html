<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Electric Shift</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#0b74ff;
      --accent-2:#2563eb;
      --green:#16a34a;
      --danger:#ef4444;
      --border:#e6e9ef;
      --radius:12px;
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
    }

    body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);}
    .wrap{max-width:980px;margin:28px auto;padding:20px;}
    header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
    h1{margin:0;font-size:20px;font-weight:700;color:#0f172a;}
    p.lead{margin:0;color:var(--muted);font-size:13px;}

    .grid{display:grid;grid-template-columns:1fr 420px;gap:18px;}
    @media(max-width:980px){.grid{grid-template-columns:1fr;}}

    .card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--border);}
    .inputs{display:grid;gap:14px;}
    label{font-size:13px;font-weight:600;color:#0f172a;margin-bottom:6px;}
    input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:14px;}
    input[type="range"]{width:100%;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .cta{display:flex;gap:12px;margin-top:6px;}
    .btn{background:var(--accent);color:#fff;padding:12px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer;}
    .btn.secondary{background:transparent;color:var(--accent-2);border:1px solid var(--border);}

    .results{display:flex;flex-direction:column;gap:12px;}
    .result-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:#fbfdff;border:1px solid #f1f5f9;}
    .big{font-size:18px;font-weight:700;}
    .savings{background:#ecfdf5;border:1px solid rgba(16,185,129,0.12);color:var(--green);padding:10px;border-radius:10px;font-weight:700;font-size:16px;text-align:center;}

    .chart-wrap{height:220px;padding:12px;background:#fff;border-radius:10px;border:1px solid #eef2ff;}
    footer{margin-top:12px;color:var(--muted);font-size:12px;}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>The Electric Shift</h1>
        <p class="lead">EV vs Petrol: See How Much Money You Save in 30 Seconds</p>
      </div>
    </header>

    <div class="grid">
      <!-- Inputs -->
      <div class="card">
        <div class="inputs">
          <div>
            <label for="dailyKm">Daily travel (km)</label>
            <input id="dailyKm" type="number" value="30" />
          </div>

          <div>
            <label for="vehicleType">Vehicle Type</label>
            <select id="vehicleType">
              <option value="car">Car</option>
              <option value="ev_scooter">EV Scooter</option>
              <option value="petrol_scooter">Petrol Scooter</option>
            </select>
          </div>

          <div class="two-col">
            <div>
              <label>Mileage (km/litre)</label>
              <input id="mileage" type="number" value="18" />
              <label>Petrol price (₹)</label>
              <input id="petrolPrice" type="number" value="100" />
            </div>
            <div>
              <label>Cost per full charge (₹)</label>
              <input id="chargeCost" type="number" value="50" />
              <label>Range per charge (km)</label>
              <input id="rangePerCharge" type="number" value="60" />
            </div>
          </div>

          <div>
            <label for="years">Years of ownership</label>
            <input id="years" type="range" min="1" max="10" value="5" />
            <span id="yearsLabel">5 years</span>
          </div>

          <div class="cta">
            <button id="calculateBtn" class="btn">Calculate Now ↓</button>
            <button id="resetBtn" class="btn secondary">Reset</button>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="card results">
        <div class="result-row">
          <div>Monthly cost</div>
          <div>
            Petrol: <span class="big" id="petrolMonthly">—</span> | EV: <span class="big" id="evMonthly">—</span>
          </div>
        </div>
        <div class="result-row">
          <div>Total cost over ownership</div>
          <div>
            Petrol: <span class="big" id="petrolTotal">—</span> | EV: <span class="big" id="evTotal">—</span>
          </div>
        </div>
        <div class="savings" id="totalSavings">—</div>

        <div class="chart-wrap">
          <canvas id="costChart"></canvas>
        </div>
        <div class="chart-wrap">
          <canvas id="cumulativeChart"></canvas>
        </div>
      </div>
    </div>

    <footer>
      Petrol cost/km = petrol_price ÷ mileage | EV cost/km = charge_cost ÷ range | Monthly km = daily × 30
    </footer>
  </div>

  <script>
    const dailyKmEl = document.getElementById('dailyKm');
    const mileageEl = document.getElementById('mileage');
    const petrolPriceEl = document.getElementById('petrolPrice');
    const chargeCostEl = document.getElementById('chargeCost');
    const rangeEl = document.getElementById('rangePerCharge');
    const yearsEl = document.getElementById('years');
    const yearsLabel = document.getElementById('yearsLabel');
    const petrolMonthlyEl = document.getElementById('petrolMonthly');
    const evMonthlyEl = document.getElementById('evMonthly');
    const petrolTotalEl = document.getElementById('petrolTotal');
    const evTotalEl = document.getElementById('evTotal');
    const totalSavingsEl = document.getElementById('totalSavings');

    const ctxCost = document.getElementById('costChart').getContext('2d');
    const costChart = new Chart(ctxCost, {
      type:'bar',
      data:{labels:['Petrol','EV'],datasets:[{data:[0,0],backgroundColor:['#ff7a7a','#60a5fa']}]},
      options:{responsive:true,plugins:{legend:{display:false}}}
    });

    const ctxCum = document.getElementById('cumulativeChart').getContext('2d');
    const cumulativeChart = new Chart(ctxCum,{
      type:'line',
      data:{labels:[],datasets:[{label:'Cumulative savings',data:[],borderColor:'#16a34a',fill:true}]},
      options:{responsive:true,plugins:{legend:{display:false}}}
    });

    function calculateAll(){
      const dailyKm = Number(dailyKmEl.value)||0;
      const mileage = Number(mileageEl.value)||1;
      const petrolPrice = Number(petrolPriceEl.value)||0;
      const chargeCost = Number(chargeCostEl.value)||0;
      const range = Number(rangeEl.value)||1;
      const years = Number(yearsEl.value)||1;

      const petrolPerKm = petrolPrice/mileage;
      const evPerKm = chargeCost/range;
      const monthlyKm = dailyKm*30;
      const petrolMonthly = monthlyKm*petrolPerKm;
      const evMonthly = monthlyKm*ev
